<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="
    width=device-width,
    initial-scale=1.0
    ">

    <title>
        RegistrApp
    </title>

    <!-- ================= CSS ================= -->

    <link
    rel="stylesheet"
    href="./assets/css/style.css">

</head>

<body>

    <!-- ================= APP ================= -->

    <div id="app">

        <!-- ================= SIDEBAR ================= -->

        <aside id="sidebar">

            <div class="logo-box">

                <h2>
                    RegistrApp
                </h2>

                <p>
                    Sistema Modular SNR
                </p>

            </div>

            <div class="sidebar-info">

                <div class="info-item">

                    <span class="label">
                        Funcionario
                    </span>

                    <span>
                        Yair B. Leal Guerra
                    </span>

                </div>

                <div class="info-item">

                    <span class="label">
                        Cargo
                    </span>

                    <span>
                        Administrativo 4044-13
                    </span>

                </div>

                <div class="info-item">

                    <span class="label">
                        ORIP
                    </span>

                    <span>
                        Barranquilla
                    </span>

                </div>

                <div class="info-item">

                    <span class="label">
                        Resolución
                    </span>

                    <span>
                        1726 de 2026
                    </span>

                </div>

            </div>

        </aside>

        <!-- ================= MAIN ================= -->

        <main id="main">

            <!-- ================= TOPBAR ================= -->

            <header class="topbar">

                <div>

                    <h1>
                        Liquidador de Derechos
                    </h1>

                    <p>
                        Superintendencia de Notariado y Registro
                    </p>

                </div>

                <div class="topbar-actions">

                    <button id="btnNuevo">

                        Nuevo

                    </button>

                    <button id="btnExportarPDF">

                        Exportar PDF

                    </button>

                </div>

            </header>

            <!-- ================= INFO ================= -->

            <section class="card">

                <h3>
                    Información del Trámite
                </h3>

                <div class="grid-2">

                    <div class="form-group">

                        <label>
                            Solicitante
                        </label>

                        <input
                        type="text"
                        id="txtSolicitante">

                    </div>

                    <div class="form-group">

                        <label>
                            Identificación
                        </label>

                        <input
                        type="text"
                        id="txtIdentificacion">

                    </div>

                    <div class="form-group">

                        <label>
                            Matrícula
                        </label>

                        <input
                        type="text"
                        id="txtMatricula">

                    </div>

                    <div class="form-group">

                        <label>
                            Fecha
                        </label>

                        <input
                        type="date"
                        id="txtFecha">

                    </div>

                </div>

            </section>

            <!-- ================= ACTOS ================= -->

            <section class="card">

                <h3>
                    Liquidación de Actos
                </h3>

                <div class="grid-actos">

                    <div class="form-group">

                        <label>
                            Código
                        </label>

                        <input
                        type="number"
                        id="txtCodigoActo">

                    </div>

                    <div class="form-group">

                        <label>
                            Acto
                        </label>

                        <input
                        type="text"
                        id="txtNombreActo"
                        disabled>

                    </div>

                    <div class="form-group">

                        <label>
                            Cuantía
                        </label>

                        <input
                        type="number"
                        id="txtCuantia">

                    </div>

                    <div class="form-group">

                        <label>
                            Folios
                        </label>

                        <input
                        type="number"
                        id="txtFolios"
                        value="1">

                    </div>

                    <div class="form-group">

                        <button
                        id="btnAgregarActo">

                            Agregar

                        </button>

                    </div>

                </div>

            </section>

            <!-- ================= TABLA ================= -->

            <section class="card">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Código
                            </th>

                            <th>
                                Acto
                            </th>

                            <th>
                                Base
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Acción
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tablaActos">

                    </tbody>

                </table>

                <div class="total-box">

                    <span>
                        TOTAL GENERAL
                    </span>

                    <h2 id="lblTotalGeneral">

                        $ 0

                    </h2>

                </div>

            </section>

        </main>

    </div>

    <!-- ================= JS ================= -->

    <script
    type="module"
    src="./js/app.js">
    </script>

</body>

</html>
