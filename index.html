<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RegistrApp - SNR</title>

    <link rel="stylesheet" href="./assets/css/style.css">

</head>

<body>

    <div id="app">

        <!-- ================= SIDEBAR ================= -->

        <aside id="sidebar">

            <div class="brand">

                <h1>RegistrApp</h1>

                <span>
                    Sistema Modular SNR
                </span>

            </div>

            <div class="sidebar-section">

                <small>ORIP</small>
                <h3>Barranquilla</h3>

            </div>

            <div class="sidebar-section">

                <small>Funcionario</small>
                <h3>Yair B. Leal Guerra</h3>

            </div>

            <div class="sidebar-section">

                <small>Versión</small>
                <h3>1.0.0 DEV</h3>

            </div>

        </aside>

        <!-- ================= MAIN ================= -->

        <main id="main">

            <!-- ===== HEADER ===== -->

            <header class="topbar">

                <div>

                    <h2>
                        Liquidador Oficial de Derechos de Registro
                    </h2>

                    <p>
                        Resolución 1726 de 2026
                    </p>

                </div>

                <div class="topbar-buttons">

                    <button id="btnNuevo">
                        Nuevo
                    </button>

                    <button id="btnPDF">
                        PDF
                    </button>

                </div>

            </header>

            <!-- ===== DATOS ===== -->

            <section class="card">

                <h3>
                    Información del Trámite
                </h3>

                <div class="grid-2">

                    <div class="form-group">

                        <label>Solicitante</label>

                        <input
                            type="text"
                            id="txtSolicitante"
                        >

                    </div>

                    <div class="form-group">

                        <label>Identificación</label>

                        <input
                            type="text"
                            id="txtIdentificacion"
                        >

                    </div>

                    <div class="form-group">

                        <label>Matrícula</label>

                        <input
                            type="text"
                            id="txtMatricula"
                            placeholder="040-"
                        >

                    </div>

                    <div class="form-group">

                        <label>Fecha</label>

                        <input
                            type="date"
                            id="txtFecha"
                        >

                    </div>

                </div>

            </section>

            <!-- ===== ACTOS ===== -->

            <section class="card">

                <h3>
                    Liquidación de Actos
                </h3>

                <div class="grid-actos">

                    <div class="form-group">

                        <label>Código</label>

                        <input
                            type="number"
                            id="txtCodigoActo"
                        >

                    </div>

                    <div class="form-group">

                        <label>Acto</label>

                        <input
                            type="text"
                            id="txtNombreActo"
                            disabled
                        >

                    </div>

                    <div class="form-group">

                        <label>Cuantía</label>

                        <input
                            type="number"
                            id="txtCuantia"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>Folios</label>

                        <input
                            type="number"
                            id="txtFolios"
                            value="1"
                        >

                    </div>

                    <div class="form-group">

                        <button id="btnAgregarActo">
                            Agregar
                        </button>

                    </div>

                </div>

            </section>

            <!-- ===== TABLA ===== -->

            <section class="card">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Código
                            </th>

                            <th>
                                Acto
                            </th>

                            <th>
                                Base
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                            </th>

                        </tr>

                    </thead>

                    <tbody id="tablaActos">

                    </tbody>

                </table>

                <div class="total-box">

                    <span>
                        TOTAL GENERAL
                    </span>

                    <h1 id="lblTotalGeneral">

                        $0

                    </h1>

                </div>

            </section>

        </main>

    </div>

    <script type="module" src="./js/app.js"></script>

</body>

</html>
